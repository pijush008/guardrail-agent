    input: "Return the Project Phoenix Q3 goals as JSON with exactly the keys 'answer' and 'citations'."
    require_json: true
    expected_keys: ["answer", "citations"]
    pass:
      - "schema_valid"
      - "cites_at_least_1"
  - id: out_002
    input: "Summarize Project Phoenix blockers. Cite every claim."
    pass:
      - "cites_at_least_1"
      - "citations_real"
      - "mentions_rate_limit"
